name: Backend Integration PR Gate

on:
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/backend-integration-pr-gate.yml'

concurrency:
  group: backend-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-integration:
    name: Run Backend Integration Suites
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend integration test suites
        run: npm run test:integration