# Render Blueprint - Deploy Zerohook with one click
# https://render.com/docs/blueprint-spec
# NOTE: This uses MongoDB Atlas for the database

services:
  # Backend API Service
  - type: web
    name: zerohook-api
    runtime: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        value: mongodb+srv://zerohook:11221122Ga@zerohook.cnyphi4.mongodb.net/zerohook?retryWrites=true&w=majority
      - key: JWT_SECRET
        value: zerohook-production-jwt-secret-2024-secure-key
      - key: JWT_EXPIRE
        value: 7d
      - key: CLIENT_URL
        value: https://zerohook.onrender.com
      # Crypto Payment Configuration (Fee-Free Direct Blockchain)
      - key: CRYPTO_MASTER_SEED
        value: dust chicken grain obvious culture gather original tube broccoli control together must loan cradle pull neutral tone notable vast funny planet bubble source visual
      - key: BITCOIN_NETWORK
        value: testnet
      - key: ETHEREUM_RPC_URL
        value: https://eth-mainnet.g.alchemy.com/v2/demo
      - key: PLATFORM_FEE_PERCENT
        value: "5"
      - key: CLOUDINARY_CLOUD_NAME
        value: devrpaqaj
      - key: CLOUDINARY_API_KEY
        value: "258444566811198"
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        value: zerohook-32-byte-encryption-2024
      - key: RATE_LIMIT_WINDOW_MS
        value: "300000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "500"
      - key: DEFAULT_COUNTRY
        value: NG
      - key: SUPPORTED_COUNTRIES
        value: NG,GH,KE,ZA,UG,TZ,RW,BW,ZM,MW

  # Frontend Static Site
  - type: web
    name: zerohook
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        value: https://zerohook-api.onrender.com/api
      - key: REACT_APP_SOCKET_URL
        value: https://zerohook-api.onrender.com
      - key: REACT_APP_DEFAULT_COUNTRY
        value: NG
      - key: REACT_APP_SUPPORTED_COUNTRIES
        value: NG,GH,KE,ZA,UG,TZ,RW,BW,ZM,MW
      - key: REACT_APP_ENABLE_VIDEO_CALLS
        value: "true"
      - key: REACT_APP_ENABLE_CRYPTO_PAYMENTS
        value: "true"
      - key: REACT_APP_ENABLE_TRUST_SYSTEM
        value: "true"

# No database section - using existing zerohookdb on Render
