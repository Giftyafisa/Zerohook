name: Trust Score Range Guard

on:
  push:
    paths:
      - server/**
      - .github/workflows/trust-score-range-guard.yml
  pull_request:
    paths:
      - server/**
      - .github/workflows/trust-score-range-guard.yml
  workflow_dispatch:

jobs:
  trust-score-range-guard:
    name: Enforce Trust Score 0-100 Range
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    env:
      NODE_ENV: production
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Validate required secret
        run: |
          if [ -z "${MONGODB_URI}" ]; then
            echo "MONGODB_URI GitHub secret is required for trust score guard checks."
            exit 1
          fi

      - name: Install server dependencies
        run: npm ci

      - name: Fail on out-of-range trust scores
        run: npm run ci:guard:trust-score-range